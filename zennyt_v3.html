<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zennyt · Je Planifie — UI Kit v3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --or:#F5A623;--or2:#D4861A;
  --gr:#3EBD5F;--gr2:#217A3A;
  --bl:#5B8DEF;--bl2:#3A5BC7;
  --re:#E53935;--re2:#B71C1C;
  --ch:#1E1E2E;--ch2:#2D2D42;--ch3:#3D3D56;
  --w:#fff;--tm:#9A9ABB;--td:#5A5A7A;
  --f:'Nunito',sans-serif;
}
body{font-family:var(--f);background:#08080F;color:var(--w);min-height:100vh}

/* ── NAV ── */
.nav{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(8,8,15,.97);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.05);padding:7px 14px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.brand{font-size:15px;font-weight:900;color:var(--or);margin-right:6px;letter-spacing:-.5px;white-space:nowrap}
.gb{padding:5px 12px;border-radius:18px;font-size:11px;font-weight:800;cursor:pointer;border:1.5px solid transparent;font-family:var(--f);white-space:nowrap;background:transparent;color:var(--td);transition:all .18s}
.gb:hover:not(.on){color:var(--or);border-color:rgba(245,166,35,.3)}
.gb.on.g1{background:var(--or);color:#1A0A00;border-color:var(--or)}
.gb.on.g2{background:var(--gr);color:#041008;border-color:var(--gr)}
.gb.on.g3{background:var(--bl);color:#040814;border-color:var(--bl)}
.gb.on.g4{background:var(--ch3);color:var(--w);border-color:var(--ch3)}
.nsep{width:1px;height:24px;background:var(--ch3);flex-shrink:0}
.sb{padding:4px 9px;border-radius:12px;font-size:10px;font-weight:800;cursor:pointer;border:1.5px solid var(--ch3);background:transparent;color:var(--td);font-family:var(--f);white-space:nowrap;transition:all .15s}
.sb.on{background:var(--ch2);color:var(--w);border-color:rgba(255,255,255,.2)}
.sb:hover:not(.on){border-color:rgba(245,166,35,.4);color:var(--or)}

/* ── STAGE ── */
.stage{padding-top:86px;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:18px;padding-bottom:48px}
.slbl{font-size:10px;font-weight:700;color:var(--td);letter-spacing:2px;text-transform:uppercase}
.row{display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;padding:0 14px}
.dev{display:flex;flex-direction:column;align-items:center;gap:5px}
.dlbl{font-size:9px;color:var(--td);font-weight:700;letter-spacing:1px;text-transform:uppercase}
.fm{width:320px;height:640px;border-radius:38px;border:3px solid #2e2e48;box-shadow:0 12px 48px rgba(0,0,0,.4),0 0 0 1px rgba(245,166,35,.06);overflow:hidden;position:relative;flex-shrink:0;background:var(--ch)}
.ft{width:496px;height:640px;border-radius:20px;border:3px solid #2e2e48;box-shadow:0 12px 48px rgba(0,0,0,.4);overflow:hidden;position:relative;flex-shrink:0;background:var(--ch)}
.fd{width:760px;height:460px;border-radius:10px;border:3px solid #2e2e48;box-shadow:0 12px 48px rgba(0,0,0,.4);overflow:hidden;position:relative;flex-shrink:0;background:var(--ch)}

/* ── SCREEN ── */
.sc{width:100%;height:100%;position:absolute;inset:0;overflow:hidden;display:none;flex-direction:column;font-family:var(--f)}
.sc.on{display:flex}

/* ── SHARED ── */
.hud{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.hi{display:flex;flex-direction:column;align-items:center;gap:1px}
.hl{font-size:8px;color:var(--tm);font-weight:700;text-transform:uppercase;letter-spacing:.7px}
.hv{font-size:14px;font-weight:900;line-height:1.2}
.hsep{width:1px;height:26px;background:rgba(255,255,255,.07)}

.gfoot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0}
.bc{flex:1;padding:11px 8px;border-radius:10px;font-size:12px;font-weight:800;border:none;cursor:pointer;font-family:var(--f)}
.bc.clr{background:rgba(255,255,255,.07);color:var(--tm)}
.bc.val{color:#0A0A0A}

.btnP{width:100%;padding:13px;border-radius:50px;font-size:13px;font-weight:900;border:none;cursor:pointer;font-family:var(--f);letter-spacing:.3px}
.btnO{width:100%;padding:11px;border-radius:50px;font-size:12px;font-weight:700;border:2px solid rgba(255,255,255,.15);background:transparent;color:var(--w);cursor:pointer;font-family:var(--f)}
.btnO:hover{border-color:rgba(255,255,255,.3)}

.sdiv{display:flex;align-items:center;gap:7px;font-size:8px;font-weight:700;color:var(--td);text-transform:uppercase;letter-spacing:1px;padding:5px 14px 2px;flex-shrink:0}
.sdiv::after{content:'';flex:1;height:1px;background:rgba(255,255,255,.05)}

/* ── HOME ── */
.home{align-items:center;justify-content:center;padding:22px 20px;position:relative;overflow:hidden}
.lc{width:88px;height:88px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.gtit{font-size:22px;font-weight:900;color:var(--w);text-align:center;line-height:1.15;letter-spacing:-.5px;margin-bottom:3px}
.gsub{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.gdesc{font-size:11px;color:var(--tm);text-align:center;max-width:215px;line-height:1.65;margin-bottom:18px}
.btns{display:flex;flex-direction:column;gap:8px;width:100%}
.sbadge{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:10px;padding:8px 13px;margin-top:12px}
.sbadge .sl{font-size:9px;color:var(--td);font-weight:700;text-transform:uppercase}
.sbadge .sv{font-size:16px;font-weight:900}

/* ── TUTO ── */
.tsc{flex-direction:column}
.thdr{background:rgba(0,0,0,.3);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.ttit{font-size:12px;font-weight:900;color:var(--w)}
.tskip{font-size:10px;color:var(--td);font-weight:700;cursor:pointer}
.tbdy{flex:1;padding:16px;display:flex;flex-direction:column;align-items:center;gap:12px;overflow:hidden}
.till{width:100%;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;min-height:150px;padding:12px}
.ttit2{font-size:14px;font-weight:900;color:var(--w);text-align:center}
.tdesc{font-size:11px;color:var(--tm);text-align:center;line-height:1.7}
.dots{display:flex;gap:5px;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ch3)}
.dot.on{border-radius:3px}
.tfoot{padding:12px 16px;flex-shrink:0}

/* ── PAUSE OVERLAY ── */
.pov{background:rgba(8,8,15,.88);backdrop-filter:blur(10px);align-items:center;justify-content:center}
.pcard{background:var(--ch2);border-radius:22px;padding:24px 20px;width:248px;display:flex;flex-direction:column;align-items:center;gap:11px;border:1px solid rgba(255,255,255,.08);box-shadow:0 16px 48px rgba(0,0,0,.5)}
.ptit{font-size:19px;font-weight:900;color:var(--w)}
.pinf{display:flex;gap:16px;align-items:center}
.pst .sl{font-size:9px;color:var(--td);font-weight:700;text-transform:uppercase;text-align:center}
.pst .sv{font-size:17px;font-weight:900;text-align:center}
.pvs{width:1px;height:32px;background:rgba(255,255,255,.07)}
.pbtns{display:flex;flex-direction:column;gap:7px;width:100%}
.pb{padding:11px;border-radius:10px;font-size:12px;font-weight:800;border:none;cursor:pointer;font-family:var(--f);width:100%}
.pb.res{color:#0A0A0A}
.pb.rst{background:rgba(255,255,255,.08);color:var(--w)}
.pb.qt{background:transparent;color:var(--td);border:1px solid rgba(255,255,255,.08)}

/* ── WIN / LOSE ── */
.endsc{align-items:center;justify-content:center;padding:18px 20px;position:relative;overflow:hidden}
.cft-row{position:absolute;top:0;left:0;right:0;height:80px;display:flex;justify-content:space-around;padding-top:6px;pointer-events:none}
.cft{width:7px;height:7px;border-radius:2px;animation:cfall 2.5s ease-in infinite}
@keyframes cfall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(100px) rotate(400deg);opacity:0}}
.end-ico{font-size:52px;margin-bottom:2px;position:relative}
.end-tit{font-size:24px;font-weight:900;position:relative;margin-bottom:2px}
.end-sub{font-size:11px;font-weight:700;position:relative;margin-bottom:10px}
.scorebox{width:100%;border-radius:13px;padding:13px 18px;text-align:center;position:relative;margin-bottom:10px}
.scorebox .pts{font-size:38px;font-weight:900;line-height:1}
.scorebox .mx{font-size:14px;color:var(--tm)}
.scorebox .lv{font-size:12px;font-weight:800;color:var(--w);margin-top:3px}
.critlist{width:100%;display:flex;flex-direction:column;gap:5px;position:relative}
.crow{display:flex;align-items:center;gap:7px}
.clbl{font-size:10px;color:var(--tm);font-weight:600;flex:1}
.cbw{width:68px;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.cb{height:100%;border-radius:3px}
.cpts{font-size:10px;font-weight:900;color:var(--w);width:24px;text-align:right}
.endbtns{display:flex;flex-direction:column;gap:7px;width:100%;position:relative;margin-top:12px}

/* lose specific */
.losebox{width:100%;background:rgba(229,57,53,.07);border:1px solid rgba(229,57,53,.14);border-radius:11px;padding:12px;margin-bottom:12px;position:relative}
.losetit{font-size:9px;color:var(--td);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:7px}
.loseitem{display:flex;align-items:flex-start;gap:7px;font-size:11px;color:var(--tm);font-weight:600;margin-bottom:5px;line-height:1.4}
.dred{width:5px;height:5px;border-radius:50%;background:var(--re);flex-shrink:0;margin-top:3px}

/* ── RESULTS PAGE ── */
.ressc{align-items:center;padding:16px;overflow-y:auto;gap:9px}
.rh .re2{font-size:40px;text-align:center}
.rh .rt{font-size:19px;font-weight:900;text-align:center}
.rh .rsub{font-size:10px;color:var(--td);text-align:center}
.rglobal{width:100%;border-radius:12px;padding:12px;text-align:center}
.gpts{font-size:36px;font-weight:900;line-height:1}
.glv{font-size:11px;font-weight:800;color:var(--w);margin-top:3px}
.sublist{width:100%;display:flex;flex-direction:column;gap:6px}
.srow{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.04);border-radius:8px;padding:8px 10px}
.sico{font-size:17px}
.sinf{flex:1}
.snm{font-size:10px;font-weight:800;color:var(--w)}
.sbw{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:3px;overflow:hidden}
.sbar{height:100%;border-radius:2px}
.ssc{font-size:13px;font-weight:900}
.interp{width:100%;background:rgba(255,255,255,.03);border-radius:10px;padding:10px 12px}
.itit{font-size:9px;font-weight:700;color:var(--td);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.itxt{font-size:11px;color:var(--tm);line-height:1.65}

/* ─────────────────────────────────
   PATHMIND  (mini-metro style)
───────────────────────────────── */
.pm-bg{background:linear-gradient(160deg,#12141E 0%,#0C0E18 100%)}

.metro-wrap{flex:1;position:relative;overflow:hidden}
.m-grid{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.035) 1px,transparent 1px);background-size:28px 28px}
/* SVG overlay for lines */
.m-svg{position:absolute;inset:0;width:100%;height:100%}
/* stations */
.sta{position:absolute;transform:translate(-50%,-50%);cursor:pointer;z-index:10;display:flex;flex-direction:column;align-items:center}
.stc{border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;border:2.5px solid transparent;transition:all .2s}
.stc.s-start{width:28px;height:28px;background:#4CAF50;border-color:#4CAF50;box-shadow:0 0 14px rgba(76,175,80,.5)}
.stc.s-end{width:28px;height:28px;background:var(--or);border-color:var(--or);box-shadow:0 0 14px rgba(245,166,35,.5)}
.stc.s-nor{width:22px;height:22px;background:#252840;border-color:#383C5A}
.stc.s-path{width:22px;height:22px;background:rgba(91,141,239,.7);border-color:var(--bl);box-shadow:0 0 8px rgba(91,141,239,.35)}
.stc.s-cost{width:22px;height:22px;background:rgba(229,57,53,.25);border-color:rgba(229,57,53,.5)}
.stc.s-star{width:22px;height:22px;background:#252840;border-color:rgba(245,166,35,.45)}
.sta-lbl{font-size:8px;font-weight:800;color:rgba(255,255,255,.55);margin-top:3px;white-space:nowrap}

.pm-legend{display:flex;gap:9px;padding:5px 14px 3px;flex-shrink:0;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.05)}
.pml{display:flex;align-items:center;gap:4px;font-size:9px;color:var(--td);font-weight:700}
.pmld{width:9px;height:9px;border-radius:50%}

/* error flash */
.err-flash{position:absolute;inset:0;background:rgba(229,57,53,.12);border:2px solid rgba(229,57,53,.3);border-radius:0;pointer-events:none;animation:eflash .6s ease-out;z-index:20}
@keyframes eflash{0%{opacity:1}100%{opacity:0}}

/* ─────────────────────────────────
   DAYSTACK  (HRM style)
───────────────────────────────── */
.ds-bg{background:linear-gradient(160deg,#0D1A0A 0%,#080F06 100%)}

.hrm{flex:1;display:flex;overflow:hidden}
.hrm-in{width:136px;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,.05);overflow-y:auto;flex-shrink:0}
.hrm-prog{flex:1;display:flex;flex-direction:column;overflow:hidden}
.hrm-out{width:96px;display:flex;flex-direction:column;border-left:1px solid rgba(255,255,255,.05);flex-shrink:0}
.hcol{font-size:8px;font-weight:800;color:var(--td);text-transform:uppercase;letter-spacing:1px;padding:6px 9px 4px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}

.titem{margin:3px 7px;border-radius:8px;padding:6px 8px;display:flex;align-items:center;gap:5px;cursor:grab;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.04);transition:all .14s}
.titem:hover{background:rgba(255,255,255,.07)}
.titem.tdep{border-color:rgba(245,166,35,.22);background:rgba(245,166,35,.05)}
.titem.tprio{border-color:rgba(229,57,53,.22);background:rgba(229,57,53,.05)}
.titem.tdone{opacity:.5;border-color:rgba(62,189,95,.2);background:rgba(62,189,95,.04)}
.titem.terr{border-color:rgba(229,57,53,.5);background:rgba(229,57,53,.1)}
.tico{font-size:15px;flex-shrink:0}
.tinf{flex:1;min-width:0}
.tnm{font-size:10px;font-weight:800;color:var(--w);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tmt{font-size:8px;color:var(--td);font-weight:600}
.tbdg{font-size:8px;font-weight:800;padding:1px 5px;border-radius:7px;flex-shrink:0}
.tbdep{background:rgba(245,166,35,.18);color:var(--or)}
.tbprio{background:rgba(229,57,53,.18);color:var(--re)}
.tbtime{background:rgba(91,141,239,.18);color:var(--bl)}
.tbdone{background:rgba(62,189,95,.18);color:var(--gr)}

.prg-area{flex:1;padding:5px 7px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;position:relative}
.hrml{display:flex;align-items:center;gap:5px;padding:5px 6px;border-radius:6px;min-height:30px;border:1px dashed rgba(255,255,255,.08);background:rgba(255,255,255,.02);transition:all .14s}
.hrml:hover{background:rgba(255,255,255,.05)}
.hrml.fld{background:rgba(62,189,95,.07);border:1px solid rgba(62,189,95,.18)}
.hrml.act{background:rgba(245,166,35,.08);border:1px solid rgba(245,166,35,.32);box-shadow:0 0 8px rgba(245,166,35,.12)}
.hrml.err{background:rgba(229,57,53,.09);border:1px solid rgba(229,57,53,.28)}
.hln{font-size:8px;color:var(--td);font-weight:700;width:13px;text-align:right;flex-shrink:0}
.hlico{font-size:13px;flex-shrink:0}
.hltxt{font-size:9px;font-weight:800;color:var(--w);flex:1}
.hlarr{font-size:9px;color:var(--td)}
.exec-line{position:absolute;left:0;right:0;height:2px;background:var(--or);box-shadow:0 0 8px rgba(245,166,35,.6);pointer-events:none;z-index:5}

.osl{margin:3px 5px;border-radius:7px;padding:5px 6px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);font-size:9px;color:var(--tm);display:flex;align-items:center;gap:4px}
.osl.ok{background:rgba(62,189,95,.09);border-color:rgba(62,189,95,.22);color:var(--gr)}
.osl.er{background:rgba(229,57,53,.09);border-color:rgba(229,57,53,.22);color:var(--re)}

/* ─────────────────────────────────
   THINKFIRST  (Tower of Hanoi)
───────────────────────────────── */
.tf-bg{background:linear-gradient(160deg,#0A0C18 0%,#060810 100%)}

.tw-area{flex:1;display:flex;align-items:flex-end;justify-content:space-around;padding:14px 12px 8px;gap:4px;position:relative}
.tw-hint{position:absolute;top:8px;left:50%;transform:translateX(-50%);background:rgba(91,141,239,.1);border:1px solid rgba(91,141,239,.18);border-radius:7px;padding:3px 9px;font-size:8px;color:var(--bl);font-weight:800;white-space:nowrap}
.tc{display:flex;flex-direction:column;align-items:center;flex:1;cursor:pointer}
.tc:hover .tbase{background:rgba(91,141,239,.18)}
.tdc{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:92px;justify-content:flex-end}
.disc{height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:900;color:var(--w);transition:all .25s}
.d1{background:linear-gradient(135deg,#4CAF50,#2E7D32)}
.d2{background:linear-gradient(135deg,var(--or),var(--or2))}
.d3{background:linear-gradient(135deg,var(--re),var(--re2))}
.d4{background:linear-gradient(135deg,var(--bl),var(--bl2))}
.disc.sel{box-shadow:0 0 0 2.5px var(--w),0 0 14px rgba(91,141,239,.5);transform:translateY(-4px)}
.disc.err-disc{box-shadow:0 0 0 2.5px var(--re),0 0 14px rgba(229,57,53,.5)}
.tpole{width:3.5px;height:92px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:-96px}
.tbase{width:104px;height:5px;background:rgba(255,255,255,.08);border-radius:3px;transition:background .2s}
.tlbl{font-size:8px;font-weight:800;color:var(--td);text-transform:uppercase;letter-spacing:.8px;margin-top:5px}

.seq-s{padding:6px 12px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0}
.seqtit{font-size:8px;color:var(--td);font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.seq-row{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.scard{min-width:46px;height:46px;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex-shrink:0;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.scard.fld{background:rgba(91,141,239,.1);border-color:rgba(91,141,239,.26)}
.scard.act{background:rgba(245,166,35,.12);border-color:rgba(245,166,35,.38);box-shadow:0 0 8px rgba(245,166,35,.18)}
.scard.errc{background:rgba(229,57,53,.1);border-color:rgba(229,57,53,.28)}
.scard.add{border:1px dashed rgba(255,255,255,.12);background:transparent}
.sn{font-size:7px;color:var(--td);font-weight:700}
.sm{font-size:12px}
.sd{font-size:7px;color:var(--td);font-weight:700}

/* ─── DESKTOP ─── */
.fd .home{flex-direction:row;justify-content:space-evenly}
.fd .home .btns{max-width:196px}
.fd .home .gdesc{margin-bottom:0}
/* pm desktop */
.fd .pm-game-wrap{flex-direction:row}
.fd .pm-game-wrap .pm-legend{flex-direction:column;width:110px;border-left:1px solid rgba(255,255,255,.05);border-top:none;padding:10px 8px;gap:8px;justify-content:center}

<script>
let G=1, S='home';
const gN={1:'PathMind',2:'DayStack',3:'ThinkFirst',4:'Résultats Globaux'};
const sN={home:'Accueil',t1:'Tutoriel 1',t2:'Tutoriel 2',gn:'Gameplay Neutre',ge:'Gameplay Erreur',gs:'Gameplay Succès',pause:'Pause',win:'Résultats Réussite',lose:'Résultats Perte'};

function selG(g){
  G=g; if(g===4){S='res';}else if(S==='res'){S='home';}
  document.querySelectorAll('#gnav .gb').forEach((b,i)=>b.classList.toggle('on',i===g-1));
  document.getElementById('snav').style.display=g===4?'none':'flex';
  render(); upd();
}
function selS(s){
  S=s;
  const ss=['home','t1','t2','gn','ge','gs','pause','win','lose'];
  document.querySelectorAll('#snav .sb').forEach((b,i)=>b.classList.toggle('on',ss[i]===s));
  render(); upd();
}
function upd(){
  document.getElementById('slbl').textContent=G===4?'Résultats Globaux — Profil de Planification':`${gN[G]} · ${sN[S]||S}`;
}
function render(){
  const h=G===4?resHTML():G===1?pm(S):G===2?ds(S):tf(S);
  ['fM','fT','fD'].forEach(id=>document.getElementById(id).innerHTML=h);
}

/* ══════════════════════════════════════════
   PATHMIND
   Scénario : Leila, 34 ans, chercheuse.
   Doit trouver le chemin optimal entre
   le labo (départ) et la salle de réunion
   (arrivée) dans un bâtiment stylisé,
   en évitant les zones "travaux" (rouges)
   et en ramassant des "dossiers" (étoiles).
══════════════════════════════════════════ */
function pm(s){
  if(s==='home')return pmHome();
  if(s==='t1')return pmT(0);
  if(s==='t2')return pmT(1);
  if(s==='gn')return pmGame('n');
  if(s==='ge')return pmGame('e');
  if(s==='gs')return pmGame('s');
  if(s==='pause')return pauseCard(`<div style="width:40px;height:40px;border-radius:50%;background:var(--or);display:flex;align-items:center;justify-content:center">${logoPath(28)}</div>`,'#251840','#F5A623','Temps','3:12','Essais','1/3');
  if(s==='win')return pmEnd(true);
  if(s==='lose')return pmEnd(false);
  return pmHome();
}

</div>`;}

function pmGame(state){
  // Stations layout for a "building corridor" feel
  // state n=neutre (partial), e=erreur (red zone touched), s=succès (full path traced)
  const sta=[
    {x:52,y:75,t:'s-start',lbl:'🔬 Labo'},
    {x:52,y:155,t:'s-nor',lbl:'Couloir A'},
    {x:130,y:155,t:'s-cost',lbl:'⚡ Travaux'},
    {x:210,y:155,t:'s-nor',lbl:'Couloir B'},
    {x:210,y:240,t:'s-star',lbl:'⭐ Dossier'},
    {x:130,y:240,t:'s-nor',lbl:'Hall'},
    {x:52,y:310,t:'s-cost',lbl:'⚡ Travaux'},
    {x:210,y:310,t:'s-nor',lbl:'Couloir C'},
    {x:210,y:390,t:'s-end',lbl:'📋 Réunion'},
  ];

  // Which stations are "on path" per state
  const pathN=[0,1]; // neutre = juste commencé, 2 stations reliées
  const pathE=[0,1,2,3]; // erreur = passé par zone travaux (index 2)
  const pathS=[0,1,5,4,7,8]; // succès = chemin optimal sans travaux + étoile
  const pathMap={n:pathN,e:pathE,s:pathS};
  const pth=pathMap[state];

  // Lines between consecutive path stations
  function lineSVG(a,b,color,dash=false){
    const dx=b.x-a.x,dy=b.y-a.y;
    return`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${color}" stroke-width="4" stroke-linecap="round"${dash?' stroke-dasharray="6,4"':''} opacity="${state==='s'?'.9':'.7'}"/>`;
  }

  let svgLines='';
  for(let i=0;i<pth.length-1;i++){
    const a=sta[pth[i]],b=sta[pth[i+1]];
    const col=state==='e'&&pth[i]===2||state==='e'&&pth[i+1]===2?'rgba(229,57,53,.8)':state==='s'?'rgba(91,141,239,.85)':'rgba(91,141,239,.65)';
    svgLines+=lineSVG(a,b,col);
  }

  let stHTML='';
  sta.forEach((s,i)=>{
    const onPath=pth.includes(i);
    let cls=s.t;
    if(onPath&&s.t==='s-nor'){cls='s-path';}
    if(state==='e'&&s.t==='s-cost'&&onPath){cls='s-cost';} // keep red
    stHTML+=`<div class="sta" style="left:${s.x}px;top:${s.y}px">
      <div class="stc ${cls}" style="width:${cls==='s-start'||cls==='s-end'?28:22}px;height:${cls==='s-start'||cls==='s-end'?28:22}px">
        ${s.t==='s-cost'?'⚡':s.t==='s-star'?'⭐':''}
      </div>
      <div class="sta-lbl">${s.lbl}</div>
    </div>`;
  });

  const hudTimeColor=state==='e'?'var(--re)':state==='s'?'var(--gr)':'var(--or)';
  const hudScore=state==='n'?'—':state==='e'?'4/10':'8/10';
  const hudTries=state==='n'?'0/3':state==='e'?'2/3':'1/3';

  const bottomMsg=state==='n'
    ?`<div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.22);border-radius:9px;padding:6px 12px;font-size:9px;color:var(--or);font-weight:700;white-space:nowrap">👆 Continue à tracer la ligne vers la salle de réunion</div>`
    :state==='e'
    ?`<div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(229,57,53,.1);border:1px solid rgba(229,57,53,.25);border-radius:9px;padding:6px 12px;font-size:9px;color:var(--re);font-weight:700;white-space:nowrap">⚠️ Zone travaux traversée — −2 pts</div>`
    :`<div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(62,189,95,.1);border:1px solid rgba(62,189,95,.22);border-radius:9px;padding:6px 12px;font-size:9px;color:var(--gr);font-weight:700;white-space:nowrap">✓ Chemin tracé — Valide pour un score estimé : 8/10</div>`;

  const errFlash=state==='e'?'<div class="err-flash"></div>':'';

  return`
<div class="sc pm-game-wrap pm-bg on" style="flex-direction:column">
  <div class="hud">
    <div class="hi"><div class="hl">Temps</div><div class="hv" style="color:${hudTimeColor}">${state==='n'?'4:22':state==='e'?'3:08':'2:44'}</div></div>
    <div class="hsep"></div>
    <div class="hi"><div class="hl">Score estimé</div><div class="hv">${hudScore}</div></div>
    <div class="hsep"></div>
    <div class="hi"><div class="hl">Essais</div><div class="hv" style="color:${hudTries==='0/3'?'var(--gr)':'var(--or)'}">${hudTries}</div></div>
    <div class="hsep"></div>
    <div style="font-size:17px;cursor:pointer">⏸</div>
  </div>
  <div class="metro-wrap">
    <div class="m-grid"></div>
    <svg class="m-svg" viewBox="0 0 280 460" preserveAspectRatio="xMidYMid meet">${svgLines}</svg>
    ${stHTML}
    ${errFlash}
    ${bottomMsg}
  </div>
  <div class="pm-legend">
    <div class="pml"><div class="pmld" style="background:#4CAF50"></div>Départ</div>
    <div class="pml"><div class="pmld" style="background:var(--or)"></div>Arrivée</div>
    <div class="pml"><div class="pmld" style="background:rgba(229,57,53,.3);border:1.5px solid rgba(229,57,53,.5)"></div>⚡ Travaux</div>
    <div class="pml"><div class="pmld" style="background:#252840;border:1.5px solid rgba(245,166,35,.4)"></div>⭐ Dossier</div>
    <div class="pml"><div class="pmld" style="background:rgba(91,141,239,.7)"></div>Chemin</div>
  </div>
  <div class="gfoot">
    <button class="bc clr">🗑 Effacer</button>
    <button class="bc val" style="background:linear-gradient(135deg,${state==='s'?'var(--or),var(--or2)':'rgba(255,255,255,.1),rgba(255,255,255,.06)'});color:${state==='s'?'var(--ch)':'var(--td)'}">✓ Valider</button>
  </div>
</div>`;}

function pmEnd(win){
  if(win){return`
<div class="sc endsc on" style="background:linear-gradient(160deg,#1A1230 0%,#0E0A1C 100%)">
  ${confetti(['#F5A623','#fff','#4CAF50','#5B8DEF'])}
  <div class="end-ico">🏆</div>

        <div style="width:78px;height:16px;border-radius:3px;background:linear-gradient(135deg,var(--bl),var(--bl2));display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:900;color:#fff">4</div>
        <div style="width:3px;height:8px;background:rgba(255,255,255,.1)"></div><div style="font-size:8px;color:var(--td);font-weight:800">Tour A</div>
      </div>
      <div style="font-size:18px;color:var(--bl)">→</div>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div style="width:3px;height:78px;background:rgba(255,255,255,.1)"></div><div style="font-size:8px;color:var(--td);font-weight:800">Tour B</div>
      </div>
      <div style="font-size:18px;color:var(--bl)">→</div>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div style="width:3px;height:78px;background:rgba(255,255,255,.1)"></div><div style="font-size:8px;color:var(--td);font-weight:800">Tour C</div>

      <div style="position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--td);white-space:nowrap">🎯 Tout déplacer vers Tour C</div>
    </div>`},
    {title:'Planifie AVANT d\'agir',desc:'Sophie renseigne toute la séquence (1 → 2 → 3…) AVANT l\'exécution. Une fois lancé, impossible de corriger. Seulement 3 erreurs d\'ordre tolérées. Minimum 15 mouvements pour 4 disques.',

        <div style="font-size:12px">${e}</div>
        <div style="font-size:9px;font-weight:800;color:${ii<4?'#fff':'var(--td)'};">${d}</div>
        ${ii<4?`<div style="margin-left:auto;font-size:8px;color:var(--td)">planifié</div>`:`<div style="margin-left:auto;font-size:8px;background:rgba(91,141,239,.18);color:var(--bl);padding:1px 5px;border-radius:5px;font-weight:800">ajouter +</div>`}

<div class="sc tsc on">

    <div class="dots"><div class="dot${i===0?' on':''}" style="${i===0?'background:var(--bl)':''}"></div><div class="dot${i===1?' on':''}" style="${i===1?'background:var(--bl)':''}"></div></div>
  </div>
  <div class="tfoot"><button class="btnP" style="background:linear-gradient(135deg,var(--bl),var(--bl2))">${i===0?'Suivant →':'Commencer ▶'}</button></div>

function tfGame(state){
  // Tower states:
  // n = initial, séquence en cours de construction (A=[1,2,3,4] B=[] C=[])
  // e = mid avec erreur (A=[4] B=[3,2] C=[1] — move 8 erreur détectée)
  // s = séquence complète prête à exécuter (A=[] B=[] C=[1,2,3,4])
  const tws={
    n:{A:['d1','d2','d3','d4'],B:[],C:[]},
    e:{A:['d4'],B:['d3','d2'],C:['d1']},
    s:{A:[],B:[],C:['d1','d2','d3','d4']},
  };
  const tw=tws[state];
  const dW={d1:32,d2:48,d3:64,d4:80};
  const dLbl={d1:'1',d2:'2',d3:'3',d4:'4'};
  const dColor={d1:'d1',d2:'d2',d3:'d3',d4:'d4'};

  function tower(name,discs){
    return`<div class="tc">
      <div class="tdc">
        ${discs.map(d=>`<div class="disc ${dColor[d]} ${state==='e'&&d==='d2'&&name==='B'?'err-disc':''}" style="width:${dW[d]}px">${dLbl[d]}</div>`).join('')}
      </div>
      <div class="tpole"></div>
      <div class="tbase"></div>
      <div class="tlbl">Tour ${name}</div>
    </div>`;}

  // sequence cards
  const seqN=[
    {n:'1',e:'🟢',d:'A→C',f:true},{n:'2',e:'🟡',d:'A→B',f:true},{n:'3',e:'🟢',d:'C→B',f:true},
    {n:'4',e:'🔵',d:'A→C',f:true},{n:'5',e:'',d:'',f:false},{n:'6',e:'',d:'',f:false},{n:'7',e:'',d:'',f:false},
  ];
  const seqE=[
    {n:'1',e:'🟢',d:'A→C',f:true},{n:'2',e:'🟡',d:'A→B',f:true},{n:'3',e:'🟢',d:'C→B',f:true},
    {n:'4',e:'🔵',d:'A→C',f:true},{n:'5',e:'🟢',d:'B→A',f:true},{n:'6',e:'🟡',d:'B→?',f:true,err:true},{n:'7',e:'',d:'',f:false},
  ];
  const seqS=[
    {n:'1',e:'🟢',d:'A→B',f:true},{n:'2',e:'🟡',d:'A→C',f:true},{n:'3',e:'🟢',d:'B→C',f:true},
    {n:'4',e:'🔵',d:'A→B',f:true},{n:'5',e:'🟢',d:'C→A',f:true},{n:'6',e:'🟡',d:'C→B',f:true},{n:'7',e:'🟢',d:'A→B',f:true},
  ];
  const seqMap={n:seqN,e:seqE,s:seqS};
  const seq=seqMap[state];
  const placed=seq.filter(s=>s.f).length;
  const erreurs=state==='e'?'1':state==='s'?'0':'0';
  const moves=state==='n'?4:state==='e'?6:7;

  return`
<div class="sc tf-bg on" style="flex-direction:column">
  <div class="hud">
    <div class="hi"><div class="hl">Moves planifiés</div><div class="hv" style="color:var(--bl)">${moves}/15</div></div>
    <div class="hsep"></div>
    <div class="hi"><div class="hl">Erreurs</div><div class="hv" style="color:${erreurs!=='0'?'var(--re)':'var(--gr)'}">${erreurs}/3</div></div>
    <div class="hsep"></div>
    <div class="hi"><div class="hl">Superflus</div><div class="hv">${state==='s'?'0':'—'}</div></div>
    <div class="hsep"></div>
    <div style="font-size:17px;cursor:pointer">⏸</div>
  </div>
  <div class="tw-area">
    <div class="tw-hint">🎯 Cible : Tour C — disque 1 au-dessus, 4 en bas</div>
    ${tower('A',tw.A)}
    ${tower('B',tw.B)}
    ${tower('C',tw.C)}
  </div>
  ${state==='e'?`<div style="padding:3px 12px 0;font-size:9px;color:var(--re);font-weight:700;text-align:center">⚠️ Move 6 invalide — grand disque sur petit (erreur 1/3)</div>`:''}
  ${state==='s'?`<div style="padding:3px 12px 0;font-size:9px;color:var(--gr);font-weight:700;text-align:center">✓ Séquence complète — prête à exécuter (15 moves, 0 superflu)</div>`:''}
  <div class="seq-s">
    <div class="seqtit">📋 Séquence de Sophie (${placed}/15 renseignés)</div>
    <div class="seq-row">
      ${seq.map(sc=>`<div class="scard ${sc.f?sc.err?'errc':'fld':''} ${!sc.f?'add':''}">
        <div class="sn">${sc.n}</div>
        <div class="sm">${sc.f?(sc.err?'⛔':sc.e):'<span style="color:rgba(255,255,255,.18);font-size:16px">+</span>'}</div>
        <div class="sd" style="color:${sc.err?'var(--re)':'var(--td)'}">${sc.f?sc.d:''}</div>
      </div>`).join('')}
      ${state!=='s'?`<div class="scard add"><div class="sm" style="font-size:16px;color:rgba(255,255,255,.18)">+</div></div>`:''}
    </div>
  </div>
  <div class="gfoot">
    <button class="bc clr">✕ Effacer séq.</button>
    <button class="bc val" style="background:linear-gradient(135deg,${state==='s'?'var(--bl),var(--bl2)':'rgba(255,255,255,.08),rgba(255,255,255,.04)'});color:${state==='s'?'#040810':'var(--td)'}">
      ${state==='s'?'▶ Exécuter':'▶ Ajouter move'}
    </button>
  </div>
</div>`;}

function tfEnd(win){
  if(win){return`
<div class="sc endsc on" style="background:linear-gradient(160deg,#08091A 0%,#040610 100%)">
  ${confetti(['#5B8DEF','#F5A623','#4CAF50','#fff'])}
  <div class="end-ico">🗼</div>
  <div class="end-tit">Tour reconstruite !</div>
  <div class="end-sub" style="color:var(--bl)">Sophie a planifié la séquence parfaite</div>
  <div class="scorebox" style="background:rgba(91,141,239,.08);border:1px solid rgba(91,141,239,.2)">
    <div class="pts" style="color:var(--bl)">9<span class="mx">/10</span></div>
    <div class="lv">🥇 Excellent</div>
  </div>
  <div class="critlist">
    <div class="crow"><div class="clbl">Séquence correcte (1er essai)</div><div class="cbw"><div class="cb" style="width:100%;background:var(--bl)"></div></div><div class="cpts">4/4</div></div>
    <div class="crow"><div class="clbl">Erreurs d'ordre (0)</div><div class="cbw"><div class="cb" style="width:100%;background:var(--bl)"></div></div><div class="cpts">3/3</div></div>
    <div class="crow"><div class="clbl">Moves superflus (&lt;10%)</div><div class="cbw"><div class="cb" style="width:66%;background:var(--or)"></div></div><div class="cpts">2/3</div></div>
  </div>
  <div class="endbtns">
    <button class="btnP" style="background:linear-gradient(135deg,var(--bl),var(--bl2))">Voir mes résultats →</button>
    <button class="btnO">↺ Rejouer</button>
  </div>
</div>`;}
  return`
<div class="sc endsc on" style="background:linear-gradient(160deg,#08091A 0%,#040610 100%)">
  <div class="end-ico">🗼</div>
  <div class="end-tit" style="color:var(--re)">Séquence invalide</div>
  <div class="end-sub" style="color:var(--tm)">Sophie a dépassé le nombre d'erreurs autorisées</div>
  <div class="losebox">
    <div class="losetit">Erreurs détectées</div>
    <div class="loseitem"><div class="dred"></div>3 erreurs d'ordre dépassées (grand disque sur petit)</div>
    <div class="loseitem"><div class="dred"></div>4 mouvements superflus (+27% vs optimal)</div>
    <div class="loseitem"><div class="dred"></div>Exécution interrompue au move 9</div>
  </div>
  <div class="scorebox" style="background:rgba(229,57,53,.07);border:1px solid rgba(229,57,53,.16)">
    <div class="pts" style="color:var(--re)">2<span class="mx">/10</span></div>
    <div class="lv" style="color:var(--tm)">Très faible — planification hiérarchique à retravailler</div>
  </div>
  <div class="endbtns">
    <button class="btnP" style="background:linear-gradient(135deg,var(--re),var(--re2))">↺ Réessayer</button>
    <button class="btnO">← Accueil</button>
  </div>
</div>`;}
